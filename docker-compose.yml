# RoundsAhead — self-contained stack.
#
# Designed to run alongside the tv-tracker stack on the same host without
# collisions: distinct container/volume names, its own cloudflared tunnel,
# and host ports that do not overlap tv-tracker (4000, 5432).
#
#   web  -> nginx serving the marketing landing page (/) + the SPA (/app),
#           proxying /api to the backend
#   api  -> Node/SQLite sync service (identity via Cloudflare Access)
#   cloudflared -> exposes the site publicly (optional profile). Currently
#                  routed to pathpilot.meetiqpro.ai; moves to roundsahead.com
#                  once the production hosting is ready.

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: roundsahead_api
    restart: always
    environment:
      PORT: 4100
      NODE_ENV: production
      DB_PATH: /app/data/roundsahead.db
      # When true, everyone shares ONE household portfolio (recommended for a
      # family collaborating on a single student). When false, each Cloudflare
      # Access identity gets its own private document.
      SHARED_PORTFOLIO: "${SHARED_PORTFOLIO:-false}"
      # Cloudflare Access identity verification (used only in per-user mode).
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD}"
    volumes:
      - roundsahead_data:/app/data
    expose:
      - "4100"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: roundsahead_web
    restart: always
    ports:
      # Host port 8080 -> container 80. Reach it on the LAN at
      # http://<docker-host>:8080 and via the tunnel publicly.
      - "8080:80"
    depends_on:
      - api

  # Public HTTPS via Cloudflare Tunnel. Enable with:  --profile cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: roundsahead_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - web
    profiles:
      - cloudflare

volumes:
  roundsahead_data:
