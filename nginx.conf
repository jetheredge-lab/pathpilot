server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend container (Cloudflare Access headers pass through unchanged).
    location /api/ {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA lives under /app (built with Vite base '/app/'). Its fingerprinted
    # assets are long-cached; any unknown /app/* path falls back to the SPA shell.
    location = /app { return 301 /app/; }

    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Everything else is the static marketing landing page at the site root.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
